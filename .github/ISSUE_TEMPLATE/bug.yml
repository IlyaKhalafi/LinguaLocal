name: Report a problem
description: Help improve a classroom workflow
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Include the page and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and deployment
      placeholder: Safari on iPhone, Docker on Ubuntu
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or server output
      description: Remove private classroom content and addresses before sharing.
